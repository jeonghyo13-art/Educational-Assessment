<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임용고시 교육학 마스터 - 반응형 인출 퀴즈 (교육평가)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
        }

        /* Glassmorphism 스타일 */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }
        
        .glass-btn:hover:not(.active-tab) {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        .active-tab {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        /* 라디오 버튼 커스텀 */
        .option-label {
            transition: all 0.2s ease;
        }
        .option-label:hover {
            background: rgba(255, 255, 255, 0.9);
        }
        .option-label.selected {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.05);
            box-shadow: 0 0 0 1px #4f46e5;
        }
        
        input[type="radio"] {
            accent-color: #4f46e5;
            width: 1.25rem;
            height: 1.25rem;
        }

        /* 피드백 애니메이션 */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feedback-anim {
            animation: slideDown 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

<div class="max-w-4xl mx-auto">
    <!-- 헤더 -->
    <header class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-900 mb-2 drop-shadow-sm">임용고시 교육학 마스터: 교육평가 편</h1>
        <p class="text-indigo-800/80 font-medium">전 범위 핵심 개념 인출 퀴즈 (무작위 셔플 & 오답노트 & 논술 모범 문장 제공)</p>
    </header>

    <!-- 탭 메뉴 -->
    <div class="flex flex-wrap justify-center gap-3 mb-8">
        <button class="glass-btn active-tab px-5 py-2.5 rounded-xl font-bold text-sm md:text-base" data-mode="all">전체 모의고사</button>
        <button class="glass-btn px-5 py-2.5 rounded-xl font-bold text-sm md:text-base text-gray-700" data-mode="short">단답형 집중</button>
        <button class="glass-btn px-5 py-2.5 rounded-xl font-bold text-sm md:text-base text-gray-700" data-mode="mcq">객관식 집중</button>
        <button class="glass-btn px-5 py-2.5 rounded-xl font-bold text-sm md:text-base text-gray-700 relative" data-mode="incorrect">
            오답 노트
            <span id="incorrect-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
        </button>
    </div>

    <!-- 메인 퀴즈 카드 -->
    <div id="quiz-section" class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 md:p-10 mb-8 border border-gray-100">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-300/50">
            <span id="question-type-badge" class="px-4 py-1.5 rounded-full text-sm font-bold shadow-sm">단답형/기입형</span>
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-gray-500" id="topic-badge">주제</span>
                <span id="progress-text" class="text-lg font-extrabold text-indigo-900 bg-white/50 px-3 py-1 rounded-lg">1 / 60</span>
            </div>
        </div>

        <div id="question-text" class="text-xl md:text-2xl font-bold mb-8 leading-tight break-keep">
            문제가 여기에 표시됩니다.
        </div>

        <!-- 객관식 컨테이너 -->
        <div id="mcq-container" class="flex flex-col gap-3 mb-8 hidden">
            <!-- JS 렌더링 -->
        </div>

        <!-- 단답형 컨테이너 -->
        <div id="short-container" class="mb-8 hidden">
            <input type="text" id="short-answer-input" class="w-full p-4 text-lg bg-white/80 border-2 border-transparent rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white shadow-inner transition-all placeholder-gray-400" placeholder="정답을 입력하세요 (엔터키로 즉시 채점)" autocomplete="off">
        </div>

        <button id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-colors text-lg">
            정답 확인
        </button>

        <!-- 피드백 영역 -->
        <div id="feedback-area" class="hidden mt-8 feedback-anim">
            <div id="feedback-header" class="p-4 rounded-t-xl font-bold text-lg flex items-center gap-2">
                <span id="feedback-icon">✅</span>
                <span id="feedback-title">정답입니다!</span>
            </div>
            
            <div class="bg-white/90 p-5 rounded-b-xl shadow-sm border border-t-0 border-gray-200 space-y-4">
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                    <h4 class="text-indigo-800 font-bold mb-1 flex items-center gap-2">💡 개념 해설</h4>
                    <p id="feedback-exp" class="text-gray-700 leading-relaxed">해설 내용</p>
                </div>
                
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <h4 class="text-blue-800 font-bold mb-1 flex items-center gap-2">🧠 암기 키워드 & 두문자</h4>
                    <p id="feedback-m" class="text-blue-900 font-medium">암기 팁</p>
                </div>

                <div class="bg-amber-50 p-4 rounded-lg border border-amber-200">
                    <h4 class="text-amber-800 font-bold mb-1 flex items-center gap-2">✍️ 실전 논술 모범 문장</h4>
                    <p id="feedback-tip" class="text-amber-900 leading-relaxed font-medium">모범 문장</p>
                </div>
            </div>

            <button id="next-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl shadow-lg transition-colors text-lg mt-4">
                다음 문제로 (Enter)
            </button>
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-section" class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 p-10 text-center hidden">
        <h2 class="text-4xl font-extrabold text-indigo-900 mb-4" id="result-heading">학습 완료!</h2>
        <div class="text-6xl font-black text-indigo-600 mb-6 drop-shadow-md">
            <span id="final-score">0</span> <span class="text-3xl text-gray-500">/ <span id="total-score">0</span></span>
        </div>
        <p class="text-lg text-gray-700 mb-8 font-medium">틀린 문제는 오답 노트에 자동으로 저장되었습니다.<br>오답 노트 탭에서 취약점을 완벽하게 보완하세요!</p>
        <button id="restart-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg transition-colors text-lg inline-block">
            처음부터 다시하기
        </button>
    </div>
</div>

<script>
    /* 
     * [데이터베이스 구축] - 마스터 프롬프트 규격
     * { id, topic, type, q, accepted(단답), options(객관식), a(정답), exp, tip, m }
     * 총 60문항 (단답형 + 객관식)
     */
    const masterDatabase = [
        {
            id: 1, topic: "평가관", type: "short",
            q: "수량화되지 않은 정보(관찰, 면담 등 질적 자료)까지 모두 포함하여 사물을 종합적으로 파악하며, 인본주의적 교육관에 토대를 두는 평가관은 무엇인가?",
            accepted: ["총평관", "총평"], a: "총평관",
            exp: "총평관은 평가대상의 가치를 구체적인 기준에 비추어 종합적, 전인적으로 판단합니다. 양적 자료와 질적 자료를 모두 이용합니다.",
            tip: "학생을 평가할 때는 단순한 지식의 암기 여부를 측정하는 것을 넘어, 관찰과 면담 등 다양한 질적 자료를 수집하여 학생의 전인적 발달을 돕는 총평관적 접근을 취해야 한다.",
            m: "총평관 = 인본주의 + 전인적 + 양/질적 자료"
        },
        {
            id: 2, topic: "평가관", type: "short",
            q: "선발적 교육관에 토대를 두며, 정해진 규정이나 법칙에 따라 사물의 속성을 객관적으로 수량화하는 데 목적을 두는 평가관은?",
            accepted: ["측정관", "측정"], a: "측정관",
            exp: "측정관은 신뢰성과 객관성을 중시하며 주로 양적 자료(수치)를 이용해 개인차를 변별하는 데 집중합니다.",
            tip: "학생의 능력을 고정된 것으로 보는 선발적 교육관과 측정관에서 벗어나, 학생의 발달 가능성을 믿고 성장 과정을 지원하는 평가관으로의 인식 전환이 필요하다.",
            m: "측정관 = 선발적 + 객관화/수량화 + 신뢰도 중시"
        },
        {
            id: 3, topic: "평가관", type: "mcq",
            q: "발달적 교육관에 토대를 두며, 모든 학습자가 목표에 도달할 수 있다는 전제 하에 학생의 성장과 발달 수준을 파악하여 교수·학습 과정을 개선하는 데 목적을 두는 관점은?",
            options: ["측정관", "평가관", "총평관", "선발관"], a: 1,
            exp: "평가관은 내용타당도를 중시하며, 학습자의 성장 발달(발달적 교육관)을 도와 교수학습을 개선하는 데 초점을 맞춥니다.",
            tip: "학교 교육은 소수의 우수자를 선발하여 서열화하는 측정관에서 벗어나, 모든 학습자가 교육목표에 도달할 수 있다는 발달적 교육관에 기초한 평가관을 지향해야 한다.",
            m: "평가관 = 발달적 + 목표도달 확인 + 내용타당도"
        },
        {
            id: 4, topic: "평가모형", type: "mcq",
            q: "타일러(Tyler)의 목표중심평가 모형에 대한 설명으로 가장 적절한 것은?",
            options: [
                "평가하려고 하는 교육현장의 미묘한 자질을 인식하는 감식안을 중시한다.",
                "목표에 반영되어 있지 않은 프로그램의 부수적 효과에 관심을 둔다.",
                "교육목표 또는 수업목표를 평가의 기준으로 삼고 행동적 용어로 진술하여 달성 정도를 확인한다.",
                "의사결정자에게 정보를 제공하여 합리적인 선택을 돕는 것을 평가로 본다."
            ], a: 2,
            exp: "타일러는 의도한 교육목표가 얼마나 달성되었는지를 평가의 핵심으로 보며, 목표를 명세적(행동적) 용어로 진술할 것을 강조합니다.",
            tip: "교육목표가 성공적으로 달성되었는지를 평가하기 위해서는 타일러의 목표중심모형에 따라 사전에 교육목표를 구체적이고 관찰 가능한 행동 용어로 명세화해야 한다.",
            m: "타일러 = 목표중심 + 달성도 확인 + 행동적 정의"
        },
        {
            id: 5, topic: "평가모형", type: "short",
            q: "스크리븐(Scriven)의 모형으로, 프로그램이 의도한 목표 달성 여부뿐만 아니라 '의도하지 않은 부수적 효과'나 '잠재적 결과'까지 포괄적으로 평가하여 실제적 가치를 판단하는 모형은?",
            accepted: ["탈목표평가모형", "탈목표평가", "탈목표 모형", "탈목표 평가"], a: "탈목표평가 모형",
            exp: "스크리븐은 목표 중심 평가를 비판하며, 탈목표 평가, 내재적/외재적 준거 평가, 형성/총괄평가의 구분, 비교/비비교평가를 모두 강조했습니다.",
            tip: "교육 프로그램의 실제적인 가치를 종합적으로 판단하기 위해, 스크리븐의 탈목표 평가 모형을 적용하여 의도된 목표뿐만 아니라 잠재적이고 부수적인 효과까지 심층적으로 분석해야 한다.",
            m: "스크리븐 = 탈목표 + 탈/외/부/비/형"
        },
        {
            id: 6, topic: "평가모형", type: "short",
            q: "스터플빔(Stufflebeam)의 CIPP 평가 모형에서 '프로그램에 사용되는 인적자원, 목표 달성 전략, 전략 실행을 위한 설계 등 활용 방법을 결정'하기 위해 의사결정을 구조화하는 단계의 평가는 무엇인가?",
            accepted: ["투입평가", "투입 평가", "input평가", "input"], a: "투입평가",
            exp: "CIPP 모형의 단계는 상황평가(Context) -> 투입평가(Input) -> 과정평가(Process) -> 산출평가(Product) 입니다.",
            tip: "교육 프로그램을 효과적으로 개선하기 위해서는 스터플빔의 CIPP 모형에 따라 계획 단계의 상황평가부터 투입, 과정, 산출평가에 이르는 체계적인 정보 수집을 통해 합리적인 의사결정을 내려야 한다.",
            m: "CIPP = 상황(계획) - 투입(구조화) - 과정(실행) - 산출(결과)"
        },
        {
            id: 7, topic: "평가모형", type: "short",
            q: "아이즈너(Eisner)의 예술적 비평 모형에서, 평가하려는 교육현장의 미묘하면서도 중요한 자질과 특성을 인식하고 감상하는 능력을 이르는 말은?",
            accepted: ["교육적감식안", "교육적 감식안", "감식안"], a: "교육적 감식안",
            exp: "아이즈너는 양적 평가를 비판하며, 전문가의 '교육적 감식안(질적 차이 인식)'과 이를 대중에게 공적인 언어로 표현하는 '교육 비평'을 강조했습니다.",
            tip: "복잡한 교육 현상을 깊이 있게 이해하기 위해서는 객관적 수치에만 의존하지 않고, 교사 스스로 교육적 감식안을 발휘하여 수업의 질적 특성을 파악하고 이를 교육 비평의 형태로 드러내야 한다.",
            m: "아이즈너 = 예술적 비평 + 교육적 감식안 + 교육 비평"
        },
        {
            id: 8, topic: "대안적평가기법", type: "short",
            q: "미래를 예측하기 위해 한 사람의 전문가가 아닌 해당 분야 전문가 집단을 동원하여, 익명을 보장한 상태에서 피드백을 포함한 반복과정을 거쳐 합의점을 도출하는 질적 연구 방법은?",
            accepted: ["델파이기법", "델파이 기법", "델파이"], a: "델파이기법",
            exp: "응답자의 익명이 보장되므로 공적으로 거론하기 어려운 미묘한 사안에도 솔직한 의견 청취가 가능합니다.",
            tip: "새로운 교육과정의 방향을 설정할 때는 전문가 집단의 합의를 도출하는 델파이 기법을 활용하여 정책 예측의 타당성과 신뢰성을 높일 수 있다.",
            m: "델파이 = 전문가 집단 + 익명 보장 + 반복적 피드백"
        },
        {
            id: 9, topic: "평가기준", type: "mcq",
            q: "준거지향평가(목표지향평가/절대평가)의 특징으로 적절한 것은?",
            options: [
                "학생의 점수가 규준집단 내에서 어느 위치에 있는지를 파악하는 데 주력한다.",
                "선발적 교육관에 바탕을 두며, 경쟁을 통한 외적 동기유발에 효과적이다.",
                "검사가 교육과정을 잘 대표하는지 묻는 내용타당도를 중시하며, 발달적 교육관에 바탕을 둔다.",

            m: "문항적합도 = 예측 모형과 실제 응답의 부합 정도"
        },
        {

            q: "e-포트폴리오에 대한 설명으로 가장 적절하지 않은 것은?",
            options: [

                "오디오, 비디오, 그래픽 등 다양한 멀티미디어 표현 방식을 사용할 수 있다.",

                "결과물보다는 단편적인 선택형 지식을 대용량 서버에 저장하고 채점하는 데 특화되어 있다."
            ], a: 3,

            m: "형성평가 기능 = 곤란 진단, 동기 유발, 수업 교정"

        {
            id: 60, topic: "대안적평가", type: "short",

            accepted: ["비교평가", "비교 평가"], a: "비교평가",
            exp: "스크리븐은 해당 프로그램 자체만의 가치를 따지는 비비교평가뿐만 아니라, 다른 유사 프로그램과 비교하여 상대적 우위를 따지는 비교평가도 필수적이라고 보았습니다.",
            tip: "새로운 교육 정책이나 프로그램을 현장에 안착시키기 위해서는, 기존 프로그램 대비 얼마나 우수한 효과를 거두고 있는지를 실증적으로 입증하는 비교평가가 수반되어야 한다.",
            m: "스크리븐 = 비비교평가 + 비교평가 병행"
        }
    ];

    // 앱 상태
    let currentMode = 'all'; // all, short, mcq, incorrect
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isFeedbackShowing = false;
    
    // 오답노트 (LocalStorage 연동)
    let incorrectIds = new Set(JSON.parse(localStorage.getItem('edu_eval_incorrect') || '[]'));

    // DOM Elements
    const dom = {
        quiz: document.getElementById('quiz-section'),
        result: document.getElementById('result-section'),
        typeBadge: document.getElementById('question-type-badge'),
        topicBadge: document.getElementById('topic-badge'),
        progress: document.getElementById('progress-text'),
        qText: document.getElementById('question-text'),
        mcqContainer: document.getElementById('mcq-container'),
        shortContainer: document.getElementById('short-container'),
        shortInput: document.getElementById('short-answer-input'),
        submitBtn: document.getElementById('submit-btn'),
        feedbackArea: document.getElementById('feedback-area'),
        feedbackIcon: document.getElementById('feedback-icon'),
        feedbackTitle: document.getElementById('feedback-title'),
        feedbackExp: document.getElementById('feedback-exp'),
        feedbackTip: document.getElementById('feedback-tip'),
        feedbackM: document.getElementById('feedback-m'),
        nextBtn: document.getElementById('next-btn'),
        incorrectBadge: document.getElementById('incorrect-badge')
    };

    // 유틸: 피셔-예이츠 무작위 셔플
    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 유틸: 문자열 정규화 (공백, 특수문자 완벽 제거)
    function normalize(str) {
        return str.replace(/[\s\-\_\.\,\!\?]/g, '').toLowerCase();
    }

    function updateBadge() {
        if(incorrectIds.size > 0) {
            dom.incorrectBadge.innerText = incorrectIds.size;
            dom.incorrectBadge.classList.remove('hidden');
        } else {
            dom.incorrectBadge.classList.add('hidden');
        }
    }

    function saveIncorrect() {
        localStorage.setItem('edu_eval_incorrect', JSON.stringify([...incorrectIds]));
        updateBadge();
    }

    // 모드 설정 및 퀴즈 시작
    function setMode(mode) {
        currentMode = mode;
        let filtered = [];

        if (mode === 'all') filtered = [...masterDatabase];
        else if (mode === 'short') filtered = masterDatabase.filter(q => q.type === 'short');
        else if (mode === 'mcq') filtered = masterDatabase.filter(q => q.type === 'mcq');
        else if (mode === 'incorrect') {
            if (incorrectIds.size === 0) {
                alert('👏 저장된 오답이 없습니다! 완벽합니다.\n전체 모의고사를 시작합니다.');
                document.querySelector('[data-mode="all"]').click();
                return;
            }
            filtered = masterDatabase.filter(q => incorrectIds.has(q.id));
        }

        currentQuestions = shuffle(filtered);
        currentIndex = 0;
        score = 0;
        
        dom.quiz.classList.remove('hidden');
        dom.result.classList.add('hidden');
        
        renderQuestion();
    }

    // 문제 렌더링
    function renderQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResult();
            return;
        }

        const q = currentQuestions[currentIndex];
        isFeedbackShowing = false;
        
        // UI 초기화
        dom.feedbackArea.classList.add('hidden');
        dom.submitBtn.classList.remove('hidden');
        dom.progress.innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
        dom.topicBadge.innerText = q.topic;
        dom.qText.innerText = q.q;

        // 타입 뱃지 스타일
        if (q.type === 'short') {
            dom.typeBadge.innerText = '단답형/기입형';
            dom.typeBadge.className = 'px-4 py-1.5 rounded-full text-sm font-bold shadow-sm bg-indigo-100 text-indigo-700';
            dom.mcqContainer.classList.add('hidden');
            dom.shortContainer.classList.remove('hidden');
            dom.shortInput.value = '';
            setTimeout(() => dom.shortInput.focus(), 50);
        } else {
            dom.typeBadge.innerText = '4지 선다형 객관식';
            dom.typeBadge.className = 'px-4 py-1.5 rounded-full text-sm font-bold shadow-sm bg-emerald-100 text-emerald-700';
            dom.shortContainer.classList.add('hidden');
            dom.mcqContainer.classList.remove('hidden');
            renderMCQ(q);
        }
    }

    // 객관식 보기 렌더링 (순서 셔플 적용)
    function renderMCQ(q) {
        dom.mcqContainer.innerHTML = '';
        let opts = q.options.map((text, idx) => ({ text, originalIdx: idx }));
        opts = shuffle(opts);
        
        q.currentAnswerIdx = opts.findIndex(o => o.originalIdx === q.a);

        opts.forEach((opt, idx) => {
            const label = document.createElement('label');
            label.className = 'option-label flex items-center p-4 bg-white/80 border-2 border-transparent rounded-xl cursor-pointer shadow-sm';
            label.innerHTML = `
                <input type="radio" name="mcq-option" value="${idx}" class="mr-4">
                <span class="text-lg font-medium">${opt.text}</span>
            `;
            label.querySelector('input').addEventListener('change', (e) => {
                document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                if(e.target.checked) label.classList.add('selected');
            });
            dom.mcqContainer.appendChild(label);
        });
    }

    // 정답 확인
    function checkAnswer() {
        const q = currentQuestions[currentIndex];
        let isCorrect = false;

        if (q.type === 'mcq') {
            const selected = document.querySelector('input[name="mcq-option"]:checked');
            if (!selected) { alert('보기를 선택해주세요.'); return; }
            isCorrect = (parseInt(selected.value) === q.currentAnswerIdx);
        } else {
            const userAns = dom.shortInput.value.trim();
            if (!userAns) { alert('정답을 입력해주세요.'); return; }
            const normUser = normalize(userAns);
            isCorrect = q.accepted.some(ans => normalize(ans) === normUser);
        }

        // 결과 처리 및 LocalStorage 연동
        isFeedbackShowing = true;
        dom.submitBtn.classList.add('hidden');
        dom.feedbackArea.classList.remove('hidden');
        
        // 애니메이션 리트리거
        dom.feedbackArea.classList.remove('feedback-anim');
        void dom.feedbackArea.offsetWidth; 
        dom.feedbackArea.classList.add('feedback-anim');

        const header = document.getElementById('feedback-header');
        
        if (isCorrect) {
            score++;
            incorrectIds.delete(q.id);
            dom.feedbackIcon.innerText = '🎉';
            dom.feedbackTitle.innerText = '완벽합니다! 정답입니다.';
            header.className = 'p-4 rounded-t-xl font-bold text-lg flex items-center gap-2 bg-emerald-100 text-emerald-800 border border-emerald-200 border-b-0';
        } else {
            incorrectIds.add(q.id);
            dom.feedbackIcon.innerText = '💡';
            const correctText = q.type === 'short' ? q.a : document.querySelectorAll('.option-label span')[q.currentAnswerIdx].innerText;
            dom.feedbackTitle.innerText = `아쉽습니다. 정답은 [ ${correctText} ] 입니다.`;
            header.className = 'p-4 rounded-t-xl font-bold text-lg flex items-center gap-2 bg-rose-100 text-rose-800 border border-rose-200 border-b-0';
        }
        saveIncorrect();

        // 해설, 암기팁, 논술팁 렌더링
        dom.feedbackExp.innerHTML = q.exp;
        dom.feedbackM.innerHTML = q.m;
        dom.feedbackTip.innerHTML = q.tip;
        
        setTimeout(() => dom.feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    }

    // 결과 화면
    function showResult() {
        dom.quiz.classList.add('hidden');
        dom.result.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        document.getElementById('total-score').innerText = currentQuestions.length;
        
        const heading = document.getElementById('result-heading');
        if(score === currentQuestions.length) heading.innerText = "🏆 갓벽합니다! 전 문항 만점!";
        else if(score >= currentQuestions.length * 0.8) heading.innerText = "훌륭합니다! 합격권입니다.";
        else heading.innerText = "조금만 더 힘내세요! 오답노트 필수!";
    }

    // 이벤트 리스너 설정
    function initEvents() {
        updateBadge();
        
        document.querySelectorAll('.glass-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.glass-btn').forEach(b => b.classList.remove('active-tab'));
                e.target.closest('.glass-btn').classList.add('active-tab');
                setMode(e.target.closest('.glass-btn').dataset.mode);
            });
        });

        dom.submitBtn.addEventListener('click', checkAnswer);
        dom.nextBtn.addEventListener('click', () => { currentIndex++; renderQuestion(); });
        document.getElementById('restart-btn').addEventListener('click', () => {
            document.querySelector('[data-mode="all"]').click();
        });

        // 엔터키 지원
        dom.shortInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); if (!isFeedbackShowing) checkAnswer(); }
        });
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && isFeedbackShowing) {
                e.preventDefault();
                dom.nextBtn.click();
            }
        });
    }

    window.onload = () => {
        initEvents();
        setMode('all');
    };
</script>
