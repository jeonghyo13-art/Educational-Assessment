<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임용고시 교육학 마스터 - 반응형 인출 퀴즈 (교육평가)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #ffffff; /* 하얀색 배경 유지 */
            min-height: 100vh;
        }

        /* 단순하고 부드러운 카드 스타일 */
        .glass-card {
            background: #ffffff;
            border: 1px solid #f3f4f6;
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.03);
            border-radius: 1.5rem;
        }

        .glass-btn {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            color: #4b5563;
            transition: all 0.2s ease;
        }
        
        .glass-btn:hover:not(.active-tab) {
            background: #f3f4f6;
            transform: translateY(-1px);
        }

        .active-tab {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        /* 라디오 버튼 커스텀 */
        .option-label {
            transition: all 0.2s ease;
            background: #ffffff;
            border: 1px solid #e5e7eb;
        }
        .option-label:hover {
            background: #f8fafc;
            border-color: #c7d2fe;
        }
        .option-label.selected {
            border-color: #4f46e5;
            background: #eef2ff;
            box-shadow: 0 0 0 1px #4f46e5;
        }
        
        input[type="radio"] {
            accent-color: #4f46e5;
            width: 1.25rem;
            height: 1.25rem;
        }

        /* 피드백 애니메이션 */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feedback-anim {
            animation: slideDown 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

<div class="max-w-4xl mx-auto">
    <!-- 헤더 -->
    <header class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-900 mb-2">임용고시 교육학 마스터: 교육평가</h1>
        <p class="text-gray-500 font-medium">총 100문항 (5개 세트) | 원하는 세트 선택 및 문제/보기 무작위 셔플</p>
    </header>

    <!-- 탭 메뉴 -->
    <div class="flex flex-wrap justify-center gap-3 mb-8 items-center">
        <div class="relative inline-flex items-center">
            <button class="glass-btn tab-btn active-tab px-5 py-2.5 rounded-l-xl font-bold text-sm md:text-base border-r-0" data-mode="exam">
                🎯 실전 모의고사
            </button>
            <select id="exam-set" class="glass-btn px-3 py-2.5 rounded-r-xl font-bold text-sm md:text-base outline-none cursor-pointer m-0 border-l border-gray-200 hover:text-indigo-600 transition-colors" title="세트 선택">
                <option value="1" selected>세트 1 (1~20번)</option>
                <option value="2">세트 2 (21~40번)</option>
                <option value="3">세트 3 (41~60번)</option>
                <option value="4">세트 4 (61~80번)</option>
                <option value="5">세트 5 (81~100번)</option>
                <option value="random">무작위 20제 추출</option>
            </select>
        </div>
        
        <button class="glass-btn tab-btn px-5 py-2.5 rounded-xl font-bold text-sm md:text-base" data-mode="all">📚 전체 문제 학습</button>
        <button class="glass-btn tab-btn px-5 py-2.5 rounded-xl font-bold text-sm md:text-base relative" data-mode="incorrect">
            📝 오답 노트
            <span id="incorrect-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
        </button>
    </div>

    <!-- 메인 퀴즈 카드 -->
    <div id="quiz-section" class="glass-card p-6 md:p-10 mb-8 hidden">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
            <span class="px-4 py-1.5 rounded-full text-sm font-bold bg-indigo-50 text-indigo-700 border border-indigo-100">객관식 (4지 선다)</span>
            <div class="flex items-center gap-3">
                <span class="text-sm font-bold text-indigo-400 bg-indigo-50 px-2 py-1 rounded-md" id="topic-badge">주제</span>
                <span id="progress-text" class="text-lg font-extrabold text-gray-700">1 / 20</span>
            </div>
        </div>

        <div id="question-text" class="text-xl md:text-2xl font-bold mb-8 leading-relaxed break-keep text-gray-800">
            문제가 여기에 표시됩니다.
        </div>

        <!-- 객관식 컨테이너 -->
        <div id="mcq-container" class="flex flex-col gap-3 mb-8">
            <!-- JS 렌더링 -->
        </div>

        <button id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition-colors text-lg">
            정답 확인
        </button>

        <!-- 피드백 영역 -->
        <div id="feedback-area" class="hidden mt-8 feedback-anim">
            <div id="feedback-header" class="p-4 rounded-t-xl font-bold text-lg flex items-center gap-2">
                <span id="feedback-icon">✅</span>
                <span id="feedback-title">정답입니다!</span>
            </div>
            
            <div class="bg-white p-5 rounded-b-xl border border-t-0 border-gray-200 space-y-4 shadow-sm">
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-100">
                    <h4 class="text-gray-800 font-bold mb-2 flex items-center gap-2">💡 개념 해설</h4>
                    <p id="feedback-exp" class="text-gray-600 leading-relaxed text-sm md:text-base">해설 내용</p>
                </div>
                
                <div class="bg-indigo-50/50 p-4 rounded-lg border border-indigo-100/50">
                    <h4 class="text-indigo-800 font-bold mb-2 flex items-center gap-2">🧠 암기 키워드</h4>
                    <p id="feedback-m" class="text-indigo-900 font-medium text-sm md:text-base">암기 팁</p>
                </div>

                <div class="bg-amber-50/50 p-4 rounded-lg border border-amber-100/50">
                    <h4 class="text-amber-800 font-bold mb-2 flex items-center gap-2">✍️ 교육학 논술 모범 문장</h4>
                    <p id="feedback-tip" class="text-amber-900 leading-relaxed font-medium text-sm md:text-base">모범 문장</p>
                </div>
            </div>

            <button id="next-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl shadow-md transition-colors text-lg mt-4">
                다음 문제로 (Enter)
            </button>
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-section" class="glass-card p-10 text-center hidden">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-4" id="result-heading">학습 완료!</h2>
        <div class="text-5xl font-black text-indigo-600 mb-6">
            <span id="final-score">0</span> <span class="text-3xl text-gray-400">/ <span id="total-score">0</span></span>
        </div>
        <p class="text-gray-600 mb-8 font-medium">틀린 문제는 오답 노트에 자동으로 저장되었습니다.</p>
        <button id="restart-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-xl shadow-md transition-colors text-lg inline-block">
            새로운 세트 시작하기
        </button>
    </div>
</div>

<script>
    // 100개의 객관식 문제 데이터베이스 (PDF 전수 반영)
    const masterDatabase = [
        {
            id: 1, topic: "평가관", type: "mcq",
            q: "인본주의적 교육관에 토대를 두며, 수량화되지 않은 관찰이나 면담 등의 질적 정보까지 모두 포함하여 대상을 종합적으로 파악하는 평가관은?",
            options: ["측정관", "평가관", "총평관", "선발관"], a: 2,
            exp: "총평관은 평가대상의 가치를 다양한 양적·질적 자료를 통해 전인적으로 판단합니다.",
            tip: "학생을 평가할 때는 단편적 지식 측정을 넘어, 질적 자료를 수집하여 학생의 전인적 발달을 돕는 총평관적 접근을 취해야 한다.",
            m: "총평관 = 인본주의 + 전인적 종합 파악 + 양/질적 자료"
        },
        {
            id: 2, topic: "평가관", type: "mcq",
            q: "신뢰성과 객관성을 중시하며, 정해진 법칙에 따라 사물의 속성을 수량화하고 선발적 교육관에 기초를 두는 관점은?",
            options: ["총평관", "측정관", "평가관", "발달관"], a: 1,
            exp: "측정관은 환경을 통제하여 오차를 줄이고 객관적으로 측정하는 데 초점을 맞춥니다.",
            tip: "소수 우수자 선발을 목적으로 하는 측정관에서 벗어나 모든 학생의 가능성을 열어두는 발달적 관점으로 전환해야 한다.",
            m: "측정관 = 선발적 교육관 + 수량화/객관화 + 신뢰도"
        },
        {
            id: 3, topic: "평가관", type: "mcq",
            q: "모든 학습자가 목표에 도달할 수 있다는 '발달적 교육관'에 기초하여, 내용타당도를 중시하는 관점은?",
            options: ["선발관", "측정관", "총평관", "평가관"], a: 3,
            exp: "평가관은 목표 도달 여부를 확인(내용타당도)하고 교수·학습 과정을 개선하는 데 목적이 있습니다.",
            tip: "교사는 평가관에 입각하여 학생이 교육목표에 도달했는지 확인하고, 이를 수업 개선의 자료로 삼아야 한다.",
            m: "평가관 = 발달적 교육관 + 교수학습 개선 + 내용타당도"
        },
        {
            id: 4, topic: "평가모형", type: "mcq",
            q: "타일러(Tyler)의 목표중심평가 모형의 가장 핵심적인 특징은?",
            options: [
                "평가하려고 하는 현상의 미묘한 자질을 인식하는 감식안을 강조한다.",
                "부수적이고 잠재적인 결과까지 모두 평가 대상에 포함한다.",
                "의사결정자에게 정보를 제공하여 합리적 선택을 돕는 과정이다.",
                "교육목표를 명세적(행동적) 용어로 진술하고 달성 정도를 확인한다."
            ], a: 3,
            exp: "타일러는 미리 설정된 행동적 교육목표가 성취되었는가를 평가의 핵심으로 보았습니다.",
            tip: "성공적인 교육 평가를 위해서는 타일러의 모형에 따라 관찰 가능한 행동 용어로 목표를 구체화해야 한다.",
            m: "타일러 = 행동적 용어 명세화 + 목표 달성도 확인"
        },
        {
            id: 5, topic: "평가모형", type: "mcq",
            q: "스크리븐(Scriven)의 탈목표평가 모형에 대한 설명으로 틀린 것은?",
            options: [
                "프로그램의 내재적 준거뿐만 아니라 외재적 준거에 의한 평가도 강조한다.",
                "형성평가와 총괄평가를 엄격히 구분하여 실시할 것을 제안했다.",
                "평가자는 관리자의 의사결정을 돕기 위해 정보만 제공하고 가치 판단은 유보해야 한다.",
                "목표로 의도하지 않은 부수적 효과까지 종합적으로 평가한다."
            ], a: 2,
            exp: "스크리븐은 평가자가 단순히 정보를 제공하는 데 그치지 않고, 프로그램의 가치와 장점을 직접 판단해야 한다고 주장했습니다.",
            tip: "교육 프로그램의 진정한 효과를 검증하려면 스크리븐의 탈목표 모형처럼 의도치 않은 잠재적 결과까지 가치 판단을 내려야 한다.",
            m: "스크리븐 탈목표 = 의도+부수적효과 종합 + 가치 판단 주도"
        },
        {
            id: 6, topic: "평가모형", type: "mcq",
            q: "스터플빔(Stufflebeam)의 CIPP 평가 모형의 4단계에 해당하지 않는 것은?",
            options: ["Context (상황평가)", "Input (투입평가)", "Performance (수행평가)", "Product (산출평가)"], a: 2,
            exp: "CIPP 모형의 'P'는 Process(과정평가)와 Product(산출평가)입니다. 수행평가는 단계가 아닙니다.",
            tip: "학교 현장의 복잡한 정책을 평가할 때는 스터플빔의 CIPP 모형을 적용하여 상황부터 산출까지 단계별로 의사결정을 지원해야 한다.",
            m: "CIPP = 상황(C)-투입(I)-과정(P)-산출(P)"
        },
        {
            id: 7, topic: "평가모형", type: "mcq",
            q: "CIPP 모형 중 프로그램에 사용될 인적·물적 자원, 목표 달성 전략 및 설계에 관한 정보를 제공하는 단계는?",
            options: ["상황평가", "투입평가", "과정평가", "산출평가"], a: 1,
            exp: "투입(Input) 평가는 목표를 어떻게 달성할 것인가에 대한 전략, 자원, 예산 등을 결정(구조화)하는 데 필요한 정보를 제공합니다.",
            tip: "프로그램 기획 시 투입평가를 통해 가용 자원과 최적의 운영 전략을 면밀히 분석해야 효율성을 높일 수 있다.",
            m: "투입평가(Input) = 자원 분배 + 전략 설계(구조화)"
        },
        {
            id: 8, topic: "평가모형", type: "mcq",
            q: "아이즈너(Eisner)의 예술적 비평 모형에서 '교육적 감식안'의 의미로 가장 적절한 것은?",
            options: [
                "평가 결과를 일반 대중이 이해할 수 있는 글로 표현하는 기술",
                "통계적 기법을 활용하여 교육 현상을 객관적으로 계량화하는 능력",
                "교육현장의 미묘하고 중요한 질적 특성을 인식하고 감상하는 전문가적 안목",
                "교육목표를 명세적으로 분석하여 세분화하는 과정"
            ], a: 2,
            exp: "감식안은 와인 감별사처럼 교육 현장의 미묘한 차이를 인식하는 개인의 전문적이고 질적인 안목입니다. 이를 공적인 글로 쓰는 것은 '교육 비평'입니다.",
            tip: "교사는 양적 수치에 매몰되지 않고, 예술적 비평 모형에 입각해 교육적 감식안을 길러 수업의 질적 가치를 포착해야 한다.",
            m: "감식안 = 질적 차이 인식 / 교육비평 = 공적 글로 표현"
        },
        {
            id: 9, topic: "대안적평가", type: "mcq",
            q: "여러 전문가의 의견을 되풀이하여 모으고(반복), 익명을 보장한 상태에서 피드백을 통해 미래를 예측하거나 합의를 도출하는 기법은?",
            options: ["소시오메트리", "메타평가", "델파이 기법", "포커스 그룹 인터뷰"], a: 2,
            exp: "델파이 기법은 전문가 집단을 대상으로 익명성 보장, 반복, 통제된 피드백을 통해 의견을 수렴합니다.",
            tip: "새로운 교육 정책 수립 시 델파이 기법을 도입하여, 갈등 없이 전문가 집단의 창의적 대안과 합의를 도출해야 한다.",
            m: "델파이 = 전문가 합의 + 익명성 + 반복 조사"
        },
        {
            id: 10, topic: "평가기준", type: "mcq",
            q: "규준지향평가(상대평가)의 특징으로 가장 올바른 것은?",
            options: [
                "개인차의 변별과 서열화를 중시하므로 검사의 신뢰도를 중시한다.",
                "협동학습과 내재적 동기 유발에 매우 적합하다.",
                "발달적 교육관에 토대를 두고 부적 편포를 기대한다.",
                "평가 도구가 교육과정을 얼마나 잘 대표하는지(내용타당도)를 가장 중시한다."
            ], a: 0,

            exp: "바람직한 피드백은 구체적이고 즉각적이며, 절대적인 성취 기준(준거)에 비추어 나아갈 방향을 교정해 주는 것입니다.",
            tip: "평가의 진정한 가치를 실현하려면 단순한 점수 통보를 넘어, 학생 스스로 약점을 보완하고 다음 단계로 나아갈 수 있도록 돕는 구체적이고 즉각적인 피드백을 적시에 제공해야 한다.",
            m: "바람직한 피드백 = 준거 기반 + 구체적/즉각적 + 긍정적 교정 지향"
        }
    ];

    // 앱 상태
    let currentMode = 'exam'; 
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isFeedbackShowing = false;
    
    // 오답노트 (LocalStorage 연동)
    let incorrectIds = new Set(JSON.parse(localStorage.getItem('edu_eval_incorrect_mcq') || '[]'));

    // DOM Elements
    const dom = {
        quiz: document.getElementById('quiz-section'),
        result: document.getElementById('result-section'),
        topicBadge: document.getElementById('topic-badge'),
        progress: document.getElementById('progress-text'),
        qText: document.getElementById('question-text'),
        mcqContainer: document.getElementById('mcq-container'),
        submitBtn: document.getElementById('submit-btn'),
        feedbackArea: document.getElementById('feedback-area'),
        feedbackIcon: document.getElementById('feedback-icon'),
        feedbackTitle: document.getElementById('feedback-title'),
        feedbackExp: document.getElementById('feedback-exp'),
        feedbackTip: document.getElementById('feedback-tip'),
        feedbackM: document.getElementById('feedback-m'),
        nextBtn: document.getElementById('next-btn'),
        incorrectBadge: document.getElementById('incorrect-badge')
    };

    // 유틸: 피셔-예이츠 무작위 셔플
    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateBadge() {
        if(incorrectIds.size > 0) {
            dom.incorrectBadge.innerText = incorrectIds.size;
            dom.incorrectBadge.classList.remove('hidden');
        } else {
            dom.incorrectBadge.classList.add('hidden');
        }
    }

    function saveIncorrect() {
        localStorage.setItem('edu_eval_incorrect_mcq', JSON.stringify([...incorrectIds]));
        updateBadge();
    }

    // 모드 설정 및 퀴즈 시작
    function setMode(mode) {
        currentMode = mode;
        let filtered = [];

        if (mode === 'exam') {
            const setVal = document.getElementById('exam-set').value;
            if (setVal === 'random') {
                // 전체에서 무작위 20제 추출
                filtered = shuffle([...masterDatabase]).slice(0, 20);
            } else {
                // 지정된 세트의 20문항을 가져온 뒤, 세트 내부에서 셔플
                const setNum = parseInt(setVal, 10);
                const startIdx = (setNum - 1) * 20;
                const endIdx = startIdx + 20;
                const setQuestions = masterDatabase.slice(startIdx, endIdx);
                filtered = shuffle(setQuestions);
            }
        } else if (mode === 'all') {
            filtered = shuffle([...masterDatabase]);
        } else if (mode === 'incorrect') {
            if (incorrectIds.size === 0) {
                alert('👏 저장된 오답이 없습니다! 완벽합니다.');
                document.querySelector('[data-mode="exam"]').click();
                return;
            }
            filtered = shuffle(masterDatabase.filter(q => incorrectIds.has(q.id)));
        }

        currentQuestions = filtered;
        currentIndex = 0;
        score = 0;
        
        dom.quiz.classList.remove('hidden');
        dom.result.classList.add('hidden');
        
        renderQuestion();
    }

    // 문제 렌더링
    function renderQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResult();
            return;
        }

        const q = currentQuestions[currentIndex];
        isFeedbackShowing = false;
        
        // UI 초기화
        dom.feedbackArea.classList.add('hidden');
        dom.submitBtn.classList.remove('hidden');
        dom.progress.innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
        dom.topicBadge.innerText = q.topic;
        dom.qText.innerText = q.q;

        renderMCQ(q);
    }

    // 객관식 보기 렌더링 (순서 100% 무작위 셔플 적용)
    function renderMCQ(q) {
        dom.mcqContainer.innerHTML = '';
        // 보기 배열 생성 시 원래 인덱스(정답 확인용) 기억
        let opts = q.options.map((text, idx) => ({ text, originalIdx: idx }));
        opts = shuffle(opts);
        
        // 셔플된 배열에서 정답이 몇 번째인지 재계산
        q.currentAnswerIdx = opts.findIndex(o => o.originalIdx === q.a);

        opts.forEach((opt, idx) => {
            const label = document.createElement('label');
            label.className = 'option-label flex items-start p-4 rounded-xl cursor-pointer shadow-sm';
            label.innerHTML = `
                <input type="radio" name="mcq-option" value="${idx}" class="mt-1 mr-4">
                <span class="text-lg font-medium leading-tight">${opt.text}</span>
            `;
            label.querySelector('input').addEventListener('change', (e) => {
                document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                if(e.target.checked) label.classList.add('selected');
            });
            dom.mcqContainer.appendChild(label);
        });
    }

    // 정답 확인
    function checkAnswer() {
        const q = currentQuestions[currentIndex];
        const selected = document.querySelector('input[name="mcq-option"]:checked');
        
        if (!selected) { alert('보기를 선택해주세요.'); return; }
        
        const isCorrect = (parseInt(selected.value) === q.currentAnswerIdx);

        // 결과 처리 및 LocalStorage 연동
        isFeedbackShowing = true;
        dom.submitBtn.classList.add('hidden');
        dom.feedbackArea.classList.remove('hidden');
        
        // 애니메이션 리트리거
        dom.feedbackArea.classList.remove('feedback-anim');
        void dom.feedbackArea.offsetWidth; 
        dom.feedbackArea.classList.add('feedback-anim');

        const header = document.getElementById('feedback-header');
        
        if (isCorrect) {
            score++;
            incorrectIds.delete(q.id);
            dom.feedbackIcon.innerText = '🎉';
            dom.feedbackTitle.innerText = '완벽합니다! 정답입니다.';
            header.className = 'p-4 rounded-t-xl font-bold text-lg flex items-center gap-2 bg-indigo-100 text-indigo-800 border border-indigo-200 border-b-0';
        } else {
            incorrectIds.add(q.id);
            dom.feedbackIcon.innerText = '💡';
            const correctText = document.querySelectorAll('.option-label span')[q.currentAnswerIdx].innerText;
            dom.feedbackTitle.innerText = `아쉽습니다. 정답은 [ ${correctText} ] 입니다.`;
            header.className = 'p-4 rounded-t-xl font-bold text-lg flex items-center gap-2 bg-rose-50 text-rose-700 border border-rose-100 border-b-0';
        }
        saveIncorrect();

        // 해설, 암기팁, 논술팁 렌더링
        dom.feedbackExp.innerHTML = q.exp;
        dom.feedbackM.innerHTML = q.m;
        dom.feedbackTip.innerHTML = q.tip;
        
        setTimeout(() => dom.feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    }

    // 결과 화면
    function showResult() {
        dom.quiz.classList.add('hidden');
        dom.result.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        document.getElementById('total-score').innerText = currentQuestions.length;
        
        const heading = document.getElementById('result-heading');
        const ratio = score / currentQuestions.length;
        if(ratio === 1) heading.innerText = "🏆 갓벽합니다! 전 문항 만점!";
        else if(ratio >= 0.8) heading.innerText = "훌륭합니다! 합격권입니다.";
        else heading.innerText = "조금만 더 힘내세요! 오답노트는 필수입니다.";
    }

    // 이벤트 리스너 설정
    function initEvents() {
        updateBadge();
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
                e.target.closest('.tab-btn').classList.add('active-tab');
                setMode(e.target.closest('.tab-btn').dataset.mode);
            });
        });

        // 세트 선택을 변경할 경우 해당 세트로 모의고사 재시작
        document.getElementById('exam-set').addEventListener('change', () => {
            document.querySelector('[data-mode="exam"]').click();
        });

        dom.submitBtn.addEventListener('click', checkAnswer);
        dom.nextBtn.addEventListener('click', () => { currentIndex++; renderQuestion(); });
        document.getElementById('restart-btn').addEventListener('click', () => {
            document.querySelector('[data-mode="exam"]').click();
        });

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (isFeedbackShowing) {
                    e.preventDefault();
                    dom.nextBtn.click();
                } else if (!dom.quiz.classList.contains('hidden')) {
                    e.preventDefault();
                    checkAnswer();
                }
            }
        });
    }

    window.onload = () => {
        initEvents();
        // 초기 로드 시 20문제 세트 모의고사 시작
        setMode('exam');
    };
</script>
</body>
</html>
